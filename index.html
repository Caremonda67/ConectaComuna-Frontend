<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/app-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#467a36" />
    <meta
      name="description"
      content="ConectaComuna: encuentra costura, manicure, cerrajería, ropa y más oficios de tu comuna en Cali con Trato Seguro Comunal."
    />
    <!-- Open Graph para WhatsApp, Facebook y enlaces compartidos -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ConectaComuna" />
    <meta property="og:title" content="ConectaComuna | Oficios de tu comuna en Cali" />
    <meta
      property="og:description"
      content="Directorio barrial de oficios y servicios en Cali. Costura, belleza, cerrajería, reparaciones y más con Trato Seguro Comunal."
    />
    <meta property="og:image" content="/brand/app-icon.png" />
    <meta property="og:locale" content="es_CO" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ConectaComuna | Oficios de tu comuna en Cali" />
    <meta
      name="twitter:description"
      content="Directorio barrial de oficios y servicios en Cali. Encuentra micro-emprendedores locales con Trato Seguro Comunal."
    />
    <meta name="twitter:image" content="/brand/app-icon.png" />

    <!-- Precalentamos conexion a los tiles CDN de mapas -->
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin />
    <title>ConectaComuna | Oficios de tu comuna</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cc_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Necesitas activar JavaScript para usar ConectaComuna.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
