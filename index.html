<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/app-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a6450" />
    <meta
      name="description"
      content="ConectaComuna: encuentra costura, manicure, cerrajeria, ropa y mas oficios de tu comuna en Cali."
    />
    <!-- Precalentamos la conexion a los tiles de OpenStreetMap: ahorra el
         handshake TLS cuando el usuario abre el mapa en redes lentas. -->
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
    <title>ConectaComuna | Oficios de tu comuna</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cc_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Necesitas activar JavaScript para usar ConectaComuna.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
